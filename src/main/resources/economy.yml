# =============================================
#          CHUNKLOCK ECONOMY CONFIG
# =============================================
#
# How do players pay to unlock chunks?
#
#   "materials"  →  Players pay with items from their inventory (default)
#                   Configure what items in biome-unlocks.yml
#
#   "vault"      →  Players pay with money (requires Vault plugin)
#
type: "materials"

# ─────────────────────────────────────────────
#  MATERIAL ECONOMY  (type: "materials")
# ─────────────────────────────────────────────
materials:
  enabled: true

  # How costs are determined:
  #
  #   "biome"          →  Each biome has fixed material costs (see biome-unlocks.yml)
  #                       Example: Plains always costs Wheat, Forest costs Oak Logs
  #                       Simple and predictable, but players can get stuck if their
  #                       starting chunk doesn't contain the required material.
  #
  #   "resource-scan"  →  The chunk you are BUYING decides what it costs. A forest
  #                       chunk costs wood, a mountain costs andesite, a desert sand.
  #
  #                       A chunk is priced by what makes it DISTINCTIVE, not by what
  #                       it holds most of - chunks are sampled bedrock to sky, so
  #                       ranking by sheer quantity would price everything as stone.
  #
  #                       You are never asked for something you cannot obtain. If the
  #                       target chunk's standout material is beyond your progression,
  #                       Chunklock walks down that chunk's own list, and only then
  #                       falls back to scanning the chunks you already own.
  #                       Prevents early-game soft-locks.
  #
  #                       Until enough chunks have been explored for "distinctive" to
  #                       mean anything, pricing uses your owned chunks and switches
  #                       over on its own as the world is explored. Nothing to set.
  #
  cost-mode: "resource-scan"

  # Resource-scan tuning (only when cost-mode: "resource-scan")
  resource-scan:
    base-cost: 16 # Starting item amount (adjusted by material rarity & progression)
    min-cost: 1 # Floor — never ask for fewer than this
    max-cost: 128 # Cap — never ask for more than this
    # Only applies to the owned-chunk fallback, not to target-chunk pricing, which ranks
    # by distinctiveness rather than by raw quantity.
    min-abundance: 10 # Ignore materials with fewer than this many blocks in owned chunks
    cache-duration: 60 # Seconds to cache scan results per player (avoids lag)

  # PRICE COMMITMENT (issue #83)
  #
  # Once a player has seen the price of a chunk, that price is honoured until they pay it
  # or deliberately re-roll it. It survives relog, restart and cache expiry, so a player
  # grinding towards an expensive material cannot have the goal changed underneath them.
  #
  # Re-rolling is the escape hatch for a genuine dead end - a player who can no longer
  # obtain the required material. It always costs something, or it is simply the old
  # exploit of reopening the GUI until a cheap material appears:
  #
  #   No Vault       -> a cooldown, per chunk (below)
  #   Vault present  -> currency, doubling with each re-roll of the same chunk
  #
  # Prices are re-derived automatically when the economy settings above change.
  price-commitment:
    reroll-cooldown-minutes: 60

  # If true, fall back to Vault money when the player can't pay with materials.
  # Requires Vault to be installed.
  vault-fallback: false

# ─────────────────────────────────────────────
#  VAULT / MONEY ECONOMY  (type: "vault")
# ─────────────────────────────────────────────
vault:
  base-cost: 100.0 # Base price per chunk
  cost-per-unlocked: 25.0 # Added per chunk the player already owns (progressive pricing)
  #                          Example: 3rd chunk = 100 + (2 × 25) = $150

  # Multiply the final price by chunk difficulty
  difficulty-multipliers:
    EASY: 0.5
    NORMAL: 1.0
    HARD: 2.0
    IMPOSSIBLE: 4.0

  # Multiply the final price by biome (unlisted biomes default to 1.0)
  biome-multipliers:
    PLAINS: 1.0
    FOREST: 1.2
    TAIGA: 1.4
    SAVANNA: 1.3
    DESERT: 1.5
    SWAMP: 1.6
    SNOWY_PLAINS: 1.7
    OCEAN: 1.8
    JUNGLE: 2.0
    BADLANDS: 2.2
    DEEP_OCEAN: 2.5

# ─────────────────────────────────────────────
#  MATERIAL VALUE CONVERSION
# ─────────────────────────────────────────────
# These values define how material requirements can be converted to
# Vault currency when `materials.vault-fallback` is enabled.
material-values:
  COBBLESTONE: 0.5
  COAL: 2.0
  COPPER_INGOT: 5.0
  IRON_INGOT: 10.0
  GOLD_INGOT: 25.0
  EMERALD: 45.0
  DIAMOND: 50.0
