# ===== CHUNKLOCK PLUGIN - LANGUAGE FILE =====
# Default English language file
# Version 2.0.0
# 
# This file contains all customizable messages for the Chunklock plugin.
# You can modify any message here to customize the plugin's text.
# 
# Placeholders:
#   %player% - Player name
#   %target_player% - Target player name
#   %cost% - Unlock cost
#   %chunk% - Chunk coordinates (x,z)
#   %chunk_x% - Chunk X coordinate
#   %chunk_z% - Chunk Z coordinate
#   %world% - World name
#   %material% - Material/item name
#   %item% - Item name
#   %amount% - Item amount
#   %balance% - Player balance
#   %team% - Team name
#   %team_name% - Team name
#   %difficulty% - Chunk difficulty
#   %biome% - Biome name
#   %x% - X coordinate
#   %z% - Z coordinate
#   %multiplier% - Cost multiplier
#   %needed% - Amount needed
#   %unlocked% - Number of unlocked chunks
#   %total% - Total chunks
#   %percentage% - Percentage value
#   %sender% - Message sender name
#   %message% - Message content
#   %action% - Action description
#   %error% - Error message
#   %command% - Command name
#   %usage% - Command usage
#   %description% - Command description
#   %permission% - Permission node
#   %location% - Location coordinates
#   %have% - Amount player has
#   %required% - Required amount
#   %missing% - Missing amount
#   %required_count% - Required count
#   %player_count% - Player count
#   %currency% - Currency name
#   %more% - Additional amount
#   %score% - Chunk score
#   %members% - Number of team members

# ===== COMMAND MESSAGES =====

commands:
  unlock:
    usage: "Usage: /chunklock unlock <player> [x] [z] [world]"
    usage-details:
      - "  - If x, z, world not specified, unlocks player's current chunk"
      - "  - Use 'here' as player name to unlock your current chunk"
    console-error: "Console cannot use 'here' - specify coordinates"
    player-not-found: "Player '%player%' not found or offline"
    world-not-found: "World '%world%' not found"
    invalid-coords: "Invalid coordinates. Use integers for x and z"
    already-unlocked: "Chunk %chunk% in %world% is already unlocked"
    success-admin: "✓ Successfully unlocked chunk %chunk% in %world% for %player%"
    success-player: "🎉 Chunk %chunk% in %world% has been unlocked by an admin!"
    error: "Error unlocking chunk: %error%"
  
  help:
    title: "Chunklock Help"
    basic-header: "═══ Basic Commands ═══"
    status: "/chunklock status - View your unlocked chunks"
    spawn: "/chunklock spawn - Return to your starting chunk"
    team: "/chunklock team - Team management commands"
    tip: "💡 Right-click a block to open the unlock GUI"
    admin-header: "═══ Admin Commands ═══"
    unlock: "/chunklock unlock <player> - Force unlock chunk for player"
    reset: "/chunklock reset <player> - Reset player progress"
    bypass: "/chunklock bypass [player] - Toggle bypass mode"
    reload: "/chunklock reload - Reload plugin configuration"
    detailed: "Use '/chunklock help <command>' for detailed help"
    team-tip: "💡 Teams share unlocked chunks and affect costs!"
    unknown: "Unknown command: %command%"
    no-permission: "You don't have permission to view help for this command."
    command-help: "Help for: %command%"
    usage: "Usage: %usage%"
    description: "Description: %description%"
    permission: "Permission: %permission%"
  
  status:
    title: "Chunklock Status"
    chunks: "Unlocked Chunks: %unlocked%"
    spawn: "Spawn Chunk: %chunk%"
    team: "Team: %team%"
  
  reset:
    confirm: "Are you sure you want to reset %player%? This cannot be undone!"
    success: "Successfully reset player %player%"
    error: "Error resetting player: %error%"
  
  reload:
    success: "Configuration reloaded successfully"
    error: "Error reloading configuration: %error%"

